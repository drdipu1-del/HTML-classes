<!DOCTYPE html>
<html>

    <body>

        <h1 id="myH"></h1>
        <p id="myP"></p>

        <script>
            // My heading:
            document.getElementById("myH").innerHTML = "Javascript Comments";

        // My paragraph:
        document.getElementById("myP").innerHTML = "My first paragraph.";
        </script>

        <h1>JavaScript Variables</h1>
        <p>Sum of two Numbers</p>
        <p id="result"></p>
        <p id="answer"></p>

        <script>
            var num1 = 5;
            var num2 = 6;
            var sum = num1 + num2;
            document.getElementById("result").innerHTML =
            "The total sum is: " + sum;

            var a = 10;
            var b = 4;
            var subtraction = a - b;
            document.getElementById("answer").innerHTML ="The subtraction is: " + subtraction;
        </script>

        <h2>Javascript Statements</h2>

        <p>A <b>Javascript program</b> is a list of <b>statements</b> to be executed by a computer.</p>

        <p id="demo"></p>
        <p id="demo1"></p>

        <script>
            var x, y, z; // Statement 1
            x = 5; // Statement 2
            y = 6; // Statement 3
            z = x + y; // Statement 4

            document.getElementById("demo").innerHTML =
            "The value of z is " + z + ".";

            var a, b, c;
            a = 7;
            b = 9;
            c = a * b;

            document.getElementById("demo1").innerHTML ="The value of c is " + c +".";

        </script>
    </body>
</html>
