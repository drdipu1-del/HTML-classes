<!DOCTYPE html>
<html>
    <head>
        <title>Introduction to CSS</title>

        <style>
            /* Universel - applies to everything on the page */
            * {
              font-size: 25px;
            }

            /* Element selectors */
            body{
                background-color: lightgray;
            }

            h1 {
                color: darkblue;

            }

            h2 {
                color: purple;
            }

            p {
                color: dimgray;
            }

            /* Class Selector */
            .my-detail {
                color: darkgreen;
                font-weight: bold;
            }

            /*  ID Selctor */
            #my-card {
                background-color: lightcyan;
            }
            
        </style>
    </head>
    <body>
        <h1>My colour Card</h1>

        <!-- Inline CSS: Add style="color:____;" inside this p tag -->
        <p style="color: crimson;"> Hi! This is my very own webpage.</p>

        <div id="my-card">

            <h2>About Me</h2>
            <p class="my-detail">My name is Atreya.</p>
            <p class="my-detail">My favourite colour is green.</p>
            <p class="my-detail">My favourite subject is chemistry.</p>
            <p class="my-detail">My favourite food is pasta.</p>

            </div>
    
    <h2 style="color: blue; background-color:brown;">Favourite Things</h2>

    <p style="color:beige; background-color: aquamarine;">My favourite animal is dog.</p>
    <p style="color:chocolate; background-color:burlywood;">My favourite sport is football.</p>
    <p style="color:cornsilk; background-color:darkolivegreen;">My favourite movie is CARS 4.</p>
    
    </body>
    </html>
